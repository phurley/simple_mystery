name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate story
    runs-on: ubuntu-latest
    steps:
      - name: Check out story
        uses: actions/checkout@v4
      - name: Run narrator validator
        uses: phurley/narrator-validator@387c9a316bb8cd876932e89a7ae3547f86f02d84
