name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate story
    runs-on: ubuntu-latest
    steps:
      - name: Check out story
        uses: actions/checkout@v4
      - name: Run narrator validator
        uses: phurley/narrator-validator@281029b92e1c3a3c2c7f38ef7788f7311da3d550
