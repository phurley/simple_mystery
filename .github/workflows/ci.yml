name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  VALIDATOR_RELEASE: 0.8.0-67059db67ce139f0

jobs:
  validate:
    name: Validate story
    runs-on: ubuntu-latest
    steps:
      - name: Check out story
        uses: actions/checkout@v4
      - name: Download pinned narrator validator
        shell: bash
        run: |
          set -euo pipefail
          validator_dir="$RUNNER_TEMP/narrator-validator"
          validator_url="https://allisonhurley.com/validator/${VALIDATOR_RELEASE}"
          mkdir -p "$validator_dir"
          for file in index.js narrator_validator.js narrator_validator_bg.wasm package.json validate.mjs; do
            curl --fail --silent --show-error --retry 3 \
              "${validator_url}/${file}" \
              --output "${validator_dir}/${file}"
          done
          cd "$validator_dir"
          sha256sum --check <<'CHECKSUMS'
          e7a34634aba4d7f1b55d9032e1231d46ed94740ad2000054040d13a82288f9cc  index.js
          7e73cb2df04e791ad3c9819789e4ca0c43f3fba53f2b6b28c4d92d045b974820  narrator_validator.js
          907d79f0621af69256f96018afc8c1449071037926955a7be2b4267070aa5ae4  narrator_validator_bg.wasm
          3027098c40f0691a5c5bf1ae2adff793dab3215a3cec362c3fabf3e0a388d24f  package.json
          1445845bbea1e14c0256675d0f4cd997bb694bad91528a1802be78c1eabf3c02  validate.mjs
          CHECKSUMS
      - name: Run narrator validator
        run: node "$RUNNER_TEMP/narrator-validator/validate.mjs" "$GITHUB_WORKSPACE"
