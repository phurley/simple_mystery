commands:
  - id: command.move
    name: Move
    description: Travel to a connected setting.
    parameters:
      - name: destination
        description: The setting to enter.
        type: setting
        required: true
    effects:
      - operation: move
        subjects: [player]
        setting: param1

  - id: command.examine
    name: Examine
    description: Inspect a person, place, or object.
    parameters:
      - name: entity
        description: The object to inspect, when examining an object.
        type: entity
        required: false
      - name: character
        description: The person to inspect, when examining a person.
        type: character
        required: false
      - name: setting
        description: The place to inspect, when examining a place.
        type: setting
        required: false

  - id: command.question
    name: Question
    description: Ask a character about a topic.
    parameters:
      - name: character
        description: The character to question.
        type: character
        required: true
      - name: topic_character
        description: The optional person being discussed.
        type: character
        required: false
      - name: topic_setting
        description: The optional place being discussed.
        type: setting
        required: false
      - name: topic_event
        description: The optional event being discussed.
        type: event
        required: false
      - name: topic_entity
        description: The optional object being discussed.
        type: entity
        required: false
      - name: topic_deduction
        description: The optional deduction being discussed.
        type: deduction
        required: false

  - id: command.claim
    name: Claim
    description: Add an available fact to the player's claimed notebook facts.

  - id: command.deduce
    name: Deduce
    description: Combine two or three claimed facts or deductions.

  - id: command.solve
    name: Solve
    description: Accuse a suspect using a deduction that explains the case.
    parameters:
      - name: suspect
        description: The character being accused.
        type: character
        required: true
      - name: theory
        description: The deduction offered as the solution.
        type: deduction
        required: true
